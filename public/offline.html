<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4FAF2">
<title>Offline · Spent.</title>
<!-- Plain static page on purpose: the service worker shows it in place of ANY page that cannot load,
     so it must not run the app's JavaScript (the app would try to render a different route). -->
<style>
  :root { color-scheme: light dark; --bg:#F4FAF2; --text:#14231A; --muted:#4A5D50; --accent:#1B6B33; --tile:#D3E5D3; --tile-fg:#14502A; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0E1712; --text:#EAF4EC; --muted:#A7BBAD; --accent:#6FDC8C; --tile:#274034; --tile-fg:#6FDC8C; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:448px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top)) 20px 40px; }
  .brand { font-size:28px; font-weight:800; letter-spacing:-1px; color:var(--accent); margin:0; }
  .hero { margin-top:60px; text-align:center; }
  .tile { width:84px; height:84px; margin:0 auto; border-radius:28px; background:var(--tile); color:var(--tile-fg); display:flex; align-items:center; justify-content:center; }
  h1 { margin:20px 0 0; font-size:26px; font-weight:800; letter-spacing:-0.8px; }
  p.lead { margin:8px auto 0; max-width:300px; font-size:15px; line-height:1.45; color:var(--muted); }
  button { margin-top:26px; width:100%; height:58px; border:0; border-radius:20px; background:var(--accent); color:#fff; font:700 17px/1 inherit; font-family:inherit; cursor:pointer; box-shadow:0 8px 20px rgba(27,107,51,.28); }
  @media (prefers-color-scheme: dark) { button { color:#0E1712; } }
</style>
</head>
<body>
<main>
  <p class="brand">Spent.</p>
  <div class="hero">
    <div class="tile">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.7M2 8.8a15 15 0 0 1 4.2-2.6M19 12.9a10 10 0 0 0-2.4-1.8M22 8.8a15 15 0 0 0-8.4-3.7M2 2l20 20"/></svg>
    </div>
    <h1>You are offline</h1>
    <p class="lead">Spent. needs a connection to load this page. Your data is safe. Reconnect and try again.</p>
  </div>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
